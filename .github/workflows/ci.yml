name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Bygg og test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sett opp .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: 'backend/**/packages.lock.json'
      - name: Gjenopprett låste pakker og kontroller sårbarheter
        run: dotnet restore backend/Aarshjul.slnx --locked-mode
      - name: Bygg
        run: dotnet build backend/Aarshjul.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/Aarshjul.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Last opp testresultater
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultater
          path: TestResults/*.trx
          if-no-files-found: ignore
